name: Bauhof

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Versionsnummer aus dem Code lesen
        id: version
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          if [ -z "$VERSION" ]; then
            echo "Keine versionName in app/build.gradle.kts gefunden — Abbruch."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: APK bauen
        run: gradle assembleDebug

      - name: APK klar benennen
        run: mv app/build/outputs/apk/debug/app-debug.apk scanbird-${{ steps.version.outputs.version }}.apk

      - name: Release anlegen und APK anhängen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          gh release create "$TAG" --target main \
            "scanbird-${{ steps.version.outputs.version }}.apk" \
            --title "Scanbird ${{ steps.version.outputs.version }}" \
            --notes "Scan to Mail — Blatt scannen, Mail ist raus. APK herunterladen und installieren." \
            || gh release upload "$TAG" "scanbird-${{ steps.version.outputs.version }}.apk" --clobber

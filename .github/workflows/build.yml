name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: APK bauen
        run: gradle assembleDebug

      - name: APK klar benennen
        run: mv app/build/outputs/apk/debug/app-debug.apk scanbird-debug.apk

      - name: APK als Artifact ablegen
        uses: actions/upload-artifact@v4
        with:
          name: scanbird-debug-apk
          path: scanbird-debug.apk

      - name: APK an das Release anhängen (nur bei Version-Tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: scanbird-debug.apk
